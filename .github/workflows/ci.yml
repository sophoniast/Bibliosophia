name: CI

on:
  push:
    paths:
      - 'Bibliosophia/**'
  pull_request:
    paths:
      - 'Bibliosophia/**'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bibliosophia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Bibliosophia/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
